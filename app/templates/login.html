{% extends "base.html" %}

{% block title %}Log in · Makewell{% endblock %}

{% block content %}
<section class="form-card">
  <h1>Welcome back</h1>
  {% if has_pending_booking %}
  <p class="notice">Log in to finish your booking.</p>
  {% endif %}

  {% if error %}
  <p class="form-error" role="alert">{{ error }}</p>
  {% endif %}

  <form method="post" action="/login">
    <label for="email">Email</label>
    <input id="email" name="email" type="email"
           value="{{ email or '' }}" autocomplete="email" required>

    <label for="password">Password</label>
    <input id="password" name="password" type="password"
           autocomplete="current-password" required>

    <button class="button" type="submit">Log in</button>
  </form>

  <p class="form-switch">New here? <a href="/signup">Create an account</a></p>
</section>
{% endblock %}
